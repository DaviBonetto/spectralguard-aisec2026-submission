schema_version: 1
phase: 4
protocol_name: spectralguard_phase4_adaptive_endgame_v1
seeds: [42, 123, 456]

execution:
  full_confirmation: I_ACCEPT_PHASE4_H100_COST
  session_wall_clock_hours: 2.4
  export_reserve_minutes: 5
  require_h100: true
  minimum_gpu_memory_gib: 75
  minimum_free_disk_gib: 40
  required_python: "3.12"
  required_torch_prefix: "2.8."
  required_cuda_major: "12"
  checkpoint_every_examples: 16
  initial_batch_size: 16
  oom_backoff: true

models:
  surrogate:
    key: mamba_790m
    id: state-spaces/mamba-790m-hf
    revision: 9822dd4b76af2bd9099b6ce2f19efd8329189a7e
    architecture: mamba
  target:
    key: mamba_2_8b
    id: state-spaces/mamba-2.8b-hf
    revision: 96c48e0292b63f5346b6d30061af2551f7101e26
    architecture: mamba

dataset:
  source_config: configs/phase3.yaml
  frozen_test_examples: 300
  validation_crafting_examples: 16
  calibration_comparator_examples: 48

black_box:
  trigger_tokens: 8
  surrogate_steps: 8
  surrogate_restarts: 3
  candidates_per_step: 16
  target_query_rounds: 2
  target_candidates_per_round: 6
  target_query_budget: 256
  response_fields: [task_score, correct, response_excerpt]

white_box:
  trigger_tokens: 8
  steps: 6
  restarts: 3
  candidates_per_step: 16
  lambda_grid: [0.25, 1.0, 2.0]
  task_weight: 1.0
  rho_weight: 0.5
  detector_seed: 42
  detector_source: results/phase3/summaries/headline_multiseed.csv
  detector_frozen_on: phase3_validation

analysis:
  bootstrap_resamples: 2000
  confidence_level: 0.95
  primary_attack_metric: conditional_asr_clean_correct
  primary_defense_metrics: [f1, auc]

exports:
  runtime_root: Experiments/phase4
  experiments_zip: Experiments/exports/phase4_experiments.zip
  handoff_tar: Experiments/exports/phase4_handoff.tar.gz
  final_zip: Experiments/exports/phase4_final.zip
