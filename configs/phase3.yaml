models:
  - {key: mamba_130m, id: state-spaces/mamba-130m-hf, revision: 1e76775f628fbf1350fbe4dbb3d971ba64af25a1, architecture: mamba, role: smoke}
  - {key: mamba_790m, id: state-spaces/mamba-790m-hf, revision: 9822dd4b76af2bd9099b6ce2f19efd8329189a7e, architecture: mamba, role: attack_source}
  - {key: mamba_1_4b, id: state-spaces/mamba-1.4b-hf, revision: 6e46eae61c27280517feef46f536d16b91076f08, architecture: mamba, role: scale_transfer}
  - {key: mamba_2_8b, id: state-spaces/mamba-2.8b-hf, revision: 96c48e0292b63f5346b6d30061af2551f7101e26, architecture: mamba, role: confirmatory}
  - {key: pythia_1_4b, id: EleutherAI/pythia-1.4b, revision: fedc38a16eea3bd36a96b906d78d11d2ce18ed79, architecture: transformer, role: size_control}
  - {key: pythia_2_8b, id: EleutherAI/pythia-2.8b, revision: 2a259cdd96a4beb1cdf467512e3904197345f6a9, architecture: transformer, role: architecture_control}
  - {key: gpt2_xl, id: openai-community/gpt2-xl, revision: 15ea56dee5df4983c59b2538573817e1667135e2, architecture: transformer, role: historical_control}
  - {key: zamba2_2_7b, id: Zyphra/Zamba2-2.7B, revision: 31afeeac4c66b4851a54290ba57c995a68c87861, architecture: hybrid, role: hybrid_generalization}

protocol:
  max_input_tokens: 768
  smoke_examples: 2
  main_test_examples: 1000
  adaptive_test_examples: 300
  transfer_test_examples: 200
  transformer_diagnostic_examples: 64
  precision_probe_examples: 10
  bootstrap_resamples: 2000
  cohen_d_bootstrap_resamples: 2000
  confidence_level: 0.95
  lexical_auc_ceiling: 0.65
  attack_accuracy_drop_threshold: 0.20
  detector_threshold_grid_points: 501
  multiple_comparisons: benjamini-hochberg
  false_discovery_rate: 0.05
  primary_unit: prompt_id
  cluster_unit: prompt_id

generation:
  associative_recall: {max_new_tokens: 16, scorer: exact_code}
  longbench_qasper: {max_new_tokens: 64, scorer: qa_token_f1}
  gsm8k: {max_new_tokens: 128, scorer: gsm8k_numeric}
  humaneval: {max_new_tokens: 256, scorer: humaneval_restricted_pass_at_1}

attacks:
  hispa_original:
    source: official_hispa_snapshot
    calibration_candidate_count: 16
    require_exact_token_length_benign_match: true
  gradient_guided:
    trigger_tokens: 8
    optimization_steps: 20
    calibration_prompts: 32
    calibration_tasks: [associative_recall, gsm8k]
    candidates_per_step: 32
    restarts: 5
  adaptive_v2:
    detector_aware: false
    rho_target_margin: 0.01
    test_examples: 300
  adaptive_v3:
    detector_aware: true
    hazard_weight: 1.0
    test_examples: 300
  pareto:
    tradeoff_points:
      - {name: task_only, task_weight: 1.0, rho_weight: 0.0, hazard_weight: 0.0}
      - {name: weak_spectral, task_weight: 1.0, rho_weight: 0.25, hazard_weight: 0.0}
      - {name: balanced, task_weight: 1.0, rho_weight: 0.5, hazard_weight: 0.0}
      - {name: strong_spectral, task_weight: 1.0, rho_weight: 1.0, hazard_weight: 0.0}
      - {name: detector_aware, task_weight: 1.0, rho_weight: 0.5, hazard_weight: 1.0}
    restarts_per_cell: 5

clasp:
  comparison_name: clasp_style_boe_xgboost_reimplementation
  top_features: 200
  xgboost_params_source: official_clasp_snapshot/archive/xgboost_hyperparam.json
  threshold_split: validation
  test_split: test

experiments:
  - {id: E01_main_mamba, model: mamba_2_8b, test_n: 1000}
  - {id: E02_gpt2_control, model: gpt2_xl, test_n: 1000}
  - {id: E03_pythia_control, model: pythia_2_8b, test_n: 300}
  - {id: E04_adaptive, model: mamba_790m, test_n: 300}
  - {id: E05_transfer_mamba_1_4b, model: mamba_1_4b, test_n: 200}
  - {id: E06_transfer_mamba_2_8b, model: mamba_2_8b, test_n: 200, derived_from: E01_main_mamba}
  - {id: E07_transfer_pythia_1_4b, model: pythia_1_4b, test_n: 200}
  - {id: E08_zamba, model: zamba2_2_7b, test_n: 300}

exports:
  root: Experiments
  experiments_zip: Experiments/exports/phase3_experiments.zip
  final_zip: Experiments/exports/phase3_final.zip
