      Mamba_triggers_scores.json: 19b89dbcc760645306a9a6a867c12d7c71b1438467ec8027b1a6320712211d20
      Mamba2_triggers_scores.json: bd3d161f5690ac214e1072be6323ba5d279e5f28da7ce475f02e011f687470d0
      data/__labels.json: 529a27105bd57da70949dfa4e6a65b29013ded88043c6ca594f36fbdfd8bd094
      roboa/hill_climbing.py: 09ad3e0b7dc45f7a690a784cb558a09cd9526f20ddb3837a94436b08ef2be548
      roboa/genetic_algorithm.py: 39703dc5de0b17265413d0d46b38b114249c4467a3940b0042c85cdb3323a443
  official_clasp:
    repo_id: hispikes-91C0
    api_base: https://anonymous.4open.science/api/repo/hispikes-91C0
