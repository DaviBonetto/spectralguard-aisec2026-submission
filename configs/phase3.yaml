schema_version: 2
phase: 3
protocol_name: spectralguard_phase3_confirmatory_v2
seeds: [42, 123, 456, 789, 2026]

execution:
  default_mode: dry_run
  allowed_modes: [dry_run, smoke, full]
  full_confirmation: I_ACCEPT_PHASE3_H100_COST
  require_clean_git_tree: true
  require_h100_for_full: true
  minimum_full_gpu_memory_gib: 75
  minimum_free_disk_gib: 80
  max_gpu_hours_per_session: 3.25
  max_gpu_hours_total: 8.25
  session_wall_clock_hours: 3.0
  export_reserve_minutes: 3
  max_download_gib: 75
  checkpoint_every_examples: 16
  fail_on_nonfinite: true
  batching:
    enabled: true
    oom_backoff: true
    bridge_rows_per_condition: 4
    bridge_conditions: [clean, adaptive_v2]
    spectral_relative_tolerance: 0.001
    prompt_nll_relative_tolerance: 0.001
    initial_batch_sizes:
      mamba_130m: 32
      mamba_790m: 32
      mamba_1_4b: 16
      mamba_2_8b: 16
      pythia_1_4b: 64
      pythia_2_8b: 32
      gpt2_xl: 32
      zamba2_2_7b: 12

dataset:
  total_examples: 1500
  split_totals: {calibration: 300, validation: 200, test: 1000}
  task_splits:
    associative_recall: {calibration: 140, validation: 100, test: 460}
    longbench_qasper: {calibration: 40, validation: 20, test: 140}
    gsm8k: {calibration: 90, validation: 60, test: 300}
    humaneval: {calibration: 30, validation: 20, test: 100}
  associative_recall:
    facts_per_prompt: 10
    template_count: 10
  sources:
    longbench:
      repo_id: THUDM/LongBench
      revision: 5e628be450b7e67fb7ae6e201bd6d8f7056f7672
      file: data.zip
      member: data/qasper.jsonl
    gsm8k:
      repo_id: openai/gsm8k
      revision: 740312add88f781978c0658806c59bc2815b9866
      file: main/test-00000-of-00001.parquet
    humaneval:
      repo_id: openai/openai_humaneval
      revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
      file: openai_humaneval/test-00000-of-00001.parquet
  official_hispa:
    repo_id: hispa_anonymous-5DB0
    api_base: https://anonymous.4open.science/api/repo/hispa_anonymous-5DB0
    required_paths:
      - README.md
      - Mamba_triggers_scores.json
      - Mamba2_triggers_scores.json
      - data/__labels.json
      - roboa/hill_climbing.py
      - roboa/genetic_algorithm.py
    expected_sha256:
