name: Verify artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Verify artifact
        run: uv run pytest -q
