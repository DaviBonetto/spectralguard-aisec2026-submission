[project]
name = "spectralguard"
version = "0.0.0"
description = "Anonymous research artifact for SpectralGuard."
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.7.0",
  "numpy==2.3.0",
  "pandas==2.3.0",
  "PyYAML==6.0.2",
  "safetensors==0.5.3",
  "scikit-learn==1.7.0",
  "torch>=2.7,<2.9",
  "transformers==4.52.4",
]

[dependency-groups]
dev = [
  "pytest==8.4.0",
  "ruff==0.11.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
